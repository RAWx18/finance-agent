services:
  app:
    build: .
    image: finance-agent:local
    init: true
    restart: "no"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
      DATA_DIR: /data
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      DAILY_API_KEY: ${DAILY_API_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
    volumes:
      - sessions:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  sessions:
