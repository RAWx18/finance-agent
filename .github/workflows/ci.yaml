name: Application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: finance-ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.12.3'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --project backend --locked --python 3.13
          npm --prefix frontend ci
      - name: Check Python and financial behavior
        run: |
          uv run --project backend ruff check backend
          uv run --project backend ruff format --check backend/app backend/tests
          uv run --project backend mypy --config-file backend/pyproject.toml backend/app
          uv run --project backend pytest backend/tests --cov=app --cov-report=xml:backend/coverage.xml
      - name: Check generated contract and frontend
        run: |
          npm --prefix frontend run contracts:check
          npm --prefix frontend run check
          npm --prefix frontend run test:unit
          npm --prefix frontend run build
          npm --prefix frontend audit --omit=dev --audit-level=high
      - name: Start the actual application image
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120
      - name: Exercise authenticated desktop, tablet, and mobile with isolated Google
        run: |
          npm --prefix frontend exec -- playwright install --with-deps chromium
          npm --prefix frontend run test:e2e
      - name: Preserve coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: |
            backend/coverage.xml
            frontend/coverage/cobertura-coverage.xml
          if-no-files-found: error
          retention-days: 3
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 3
      - name: Stop isolated application
        if: always()
        run: docker compose down --volumes

  coverage:
    needs: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage
      - uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45
        with:
          use_oidc: true
          files: backend/coverage.xml,frontend/coverage/cobertura-coverage.xml
          disable_search: true
          fail_ci_if_error: true
