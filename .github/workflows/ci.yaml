name: Application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: finance-ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.12.3'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --project backend --locked --python 3.13
          npm --prefix frontend ci
      - name: Check Python and financial behavior
        run: |
          uv run --project backend ruff check backend
          uv run --project backend ruff format --check backend/app backend/tests
          uv run --project backend mypy --config-file backend/pyproject.toml backend/app
          uv run --project backend pytest backend/tests --cov=app --cov-report=xml:backend/coverage.xml
      - name: Check generated contract and frontend
        run: |
          npm --prefix frontend run contracts:check
          npm --prefix frontend run check
          npm --prefix frontend run test:unit
          npm --prefix frontend run build
          npm --prefix frontend audit --omit=dev --audit-level=high
      - name: Start the actual application image
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal((await fetch("http://localhost:8000/health/ready")).status, 200); assert.equal((await fetch("http://localhost:8000/api/session")).status, 401); assert.equal((await fetch("http://localhost:8000/money", {redirect:"manual"})).status, 303);'
      - name: Exercise authenticated desktop, tablet, and mobile with isolated Google
        run: |
          npm --prefix frontend exec -- playwright install --with-deps chromium
          npm --prefix frontend run test:e2e
      - name: Preserve coverage
        if: always() && hashFiles('backend/coverage.xml', 'frontend/coverage/cobertura-coverage.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            backend/coverage.xml
            frontend/coverage/cobertura-coverage.xml
          if-no-files-found: error
          retention-days: 3
      - name: Preserve browser failure evidence
        if: failure() && hashFiles('frontend/playwright-report/**', 'frontend/test-results/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 3
      - name: Stop isolated application
        if: always()
        run: docker compose down --volumes

  coverage:
    needs: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: backend/coverage.xml,frontend/coverage/cobertura-coverage.xml
          disable_search: true
          fail_ci_if_error: true
