[project]
name = "finance-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiohttp>=3.13,<4",
  "aiosqlite>=0.22,<0.23",
  "azure-cognitiveservices-speech>=1.47,<2",
  "cryptography>=46,<49",
  "fastapi>=0.135,<1",
  "joserfc>=1.6,<2",
  "loguru>=0.7,<1",
  "openai>=2,<3",
  "pipecat-ai[azure,daily,openai]==1.9.0",
  "pydantic>=2.12,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.151,<7",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
