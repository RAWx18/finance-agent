currency = "INR"
timezone = "Asia/Kolkata"
horizon_days = 30
retention_hours = 24
cleanup_seconds = 60
heartbeat_seconds = 15
max_request_bytes = 131072
max_records = 200
max_occurrences = 1000
max_money_paise = 1000000000000
max_total_paise = 1000000000000000
max_sessions = 100
max_commands = 100
max_event_streams = 200
max_streams_per_session = 4
workspace_max_questions = 3
workspace_max_actions = 6

[diagnostics]
# Active file plus this many rotated files; diagnostics exclude private payloads.
max_bytes = 2097152
backup_count = 3

[exchange]
timeout_seconds = 5

[history]
max_conversations = 200
max_messages = 2000
max_caption_chars = 16000
max_search_chars = 200

[memory]
# Limits apply separately to common preferences, user context and each saved chat.
max_notes = 8
max_note_chars = 240
# Common preferences last until forgotten; chat notes follow the chat's expiry.
user_days = 30

[auth]
session_hours = 168
idle_hours = 24
oauth_seconds = 300
recheck_seconds = 300
recent_signin_seconds = 900
provider_timeout_seconds = 5
provider_max_bytes = 65536
provider_connections = 8
clock_skew_seconds = 30
jwks_cache_seconds = 3600
jwks_refresh_seconds = 30
max_flows = 1000
max_users = 1000
max_logins_per_user = 5
max_cookie_bytes = 4096
rate_window_seconds = 60
login_limit = 10
invalid_limit = 30
account_limit = 10
mutation_limit = 120
voice_limit = 5
max_rate_keys = 2000

[voice]
assistant_name = "Isha"
# Opening guidance for the model, not a scripted spoken reply.
introduction = "Introduce yourself as {assistant_name}, an AI financial assistant. Briefly explain that you can help plan the next {horizon_days} days, then invite the user's main money concern. Use natural wording; do not request a specific amount or read existing figures."
language = "English"
tone = "Warm, calm and practical. Speak to an adult as a capable financial assistant, not a form or a lecturer."
# Use an exact verified Azure deployment name for an approved model.
model = "gpt-5.6-luna"
reasoning_effort = "none"
# Maximum inactivity during model generation; content and tool chunks refresh this deadline.
model_timeout_seconds = 35
max_completion_tokens = 1600
max_tool_rounds = 6
history_turns = 40
response_max_sentences = 3
outcome_max_sentences = 5
max_questions = 1
stt_locale = "en-IN"
stt_segmentation_ms = 500
stt_phrases = ["rupees", "paise", "lakh", "lakhs", "crore", "crores", "EMI", "equated monthly instalment", "minimum due"]
tts_voice = "en-IN-Aarti:DragonHDLatestNeural"
tts_locale = "en-IN"
tts_gender = "Female"
# Bound initial audio and gaps in audio progress; the overall call remains time-limited.
tts_first_audio_seconds = 10
tts_progress_seconds = 5
# VAD detects speech; the turn timeout separately gives the user time to continue.
vad_confidence = 0.5
# Brief onsets and a moderate volume gate retain short corrections and hesitations.
vad_start_seconds = 0.1
vad_stop_seconds = 0.2
vad_min_volume = 0.5
call_seconds = 1800
startup_seconds = 45
shutdown_seconds = 10
tool_timeout_seconds = 30
# Preserve thinking pauses; STT finalization does not itself finish the user turn.
speech_timeout_seconds = 2.6
inactive_seconds = 60
